<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎳 KegelClub Master Pro Hub 🏆</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #0d9488;
            --accent-hover: #115e59;
            --border: #334155;
            --danger: #ef4444;
            --danger-hover: #b91c1c;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        .theme-light {
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent: #0d9488;
            --accent-hover: #115e59;
            --border: #cbd5e1;
            --danger: #ef4444;
            --danger-hover: #b91c1c;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        .theme-classic {
            --bg-main: #2c1607;
            --bg-card: #3e200c;
            --text-main: #fceddb;
            --text-muted: #b8977e;
            --accent: #d97706;
            --accent-hover: #b45309;
            --border: #5c3317;
            --danger: #dc2626;
            --danger-hover: #991b1b;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 800px;
            text-align: center;
            margin-bottom: 30px;
            background: var(--bg-card);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px var(--shadow);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent), #38bdf8);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        h1 span {
            color: var(--accent);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        button, .file-label {
            background-color: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px var(--shadow);
        }

        button:hover, .file-label:hover {
            border-color: var(--accent);
            background-color: var(--border);
        }

        button.btn-accent {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
        }

        button.btn-accent:hover {
            background-color: var(--accent-hover);
        }

        input[type="file"] {
            display: none;
        }

        main {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .grid-links {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 15px;
        }

        .link-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 10px var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            transition: transform 0.2s, border-color 0.2s;
        }

        .link-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent);
        }

        .link-info {
            margin-bottom: 15px;
            cursor: pointer;
        }

        .link-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .card-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid transparent;
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .editor-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px var(--shadow);
        }

        .editor-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-muted);
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: var(--bg-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--accent);
        }

        footer {
            margin-top: auto;
            padding: 30px 0 10px 0;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.5rem; }
            .controls-bar { width: 100%; }
            button, .file-label { flex: 1 1 calc(50% - 10px); justify-content: center; min-width: 120px; }
        }

    /* --- Rollende Kugel im Header --- */
    header {
        position: relative; /* Wichtig, damit die Kugel innerhalb des Headers bleibt */
        overflow: hidden;   /* Schneidet die Kugel außerhalb des Headers ab */
    }

    .h-ball {
        position: absolute;
        top: 50%;
        left: -40px;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        /* Dreidimensionaler, bunter Farbverlauf im impressionistischen Stil */
        background: radial-gradient(circle at 33% 28%, #ffffff 0%, #ff8c00 40%, #ff2a00 75%, #4a0000 100%);
        animation: hroll 8s linear infinite;
        opacity: 0.65; /* Leicht transparent, damit es edel im Hintergrund wirkt */
        pointer-events: none; /* Klicks gehen durch die Kugel durch */
        filter: drop-shadow(0 2px 10px rgba(255, 107, 53, 0.6));
        z-index: 1; /* Im Hintergrund des Headers */
    }

    /* Die Animations-Schleife für das Rollen und Drehen */
    @keyframes hroll {
        0% {
            left: -40px;
            transform: translateY(-50%) rotate(0deg);
        }
        100% {
            left: 110%;
            transform: translateY(-50%) rotate(720deg);
        }
    }

    /* Stellt sicher, dass der Text über der Kugel bleibt */
    header h1, header p, header .controls-bar {
        position: relative;
        z-index: 2;
    }

    </style>
</head>
<body class="theme-turquoise">

    <header>

        <div class="h-ball"></div>

        <h1>🎳 KegelClub <span>Master Pro Hub</span> 🏆</h1>
        <p class="subtitle">Willkommen! Wähle eine App, verwalte deine Links oder starte das Spiel.</p>
        
        <div class="controls-bar">
            <button id="theme-btn" onclick="toggleStyleMode()">🎨 Style wechseln</button>
            <button id="fullscreen-btn" onclick="toggleFullscreen()">📺 Vollbildmodus</button>
            <button onclick="exportLinksJSON()">💾 Links Sichern</button>
            <label class="file-label">
                📂 Links Laden
                <input type="file" id="import-file" accept=".json" onchange="importLinksJSON(event)">
            </label>
        </div>
    </header>

    <main>
        <div class="grid-links" id="links-container">
            <!-- Dynamische Links werden hier injiziert -->
        </div>

        <section class="editor-section">
            <h2 id="editor-title">➕ Neuen Link / App hinzufügen</h2>
            <input type="hidden" id="edit-index" value="">
            
            <div class="form-group">
                <label for="app-icon">Icon / Emoji</label>
                <input type="text" id="app-icon" placeholder="z.B. 🎳, 📱, 📊, 📋">
            </div>
            <div class="form-group">
                <label for="app-title">Titel der App</label>
                <input type="text" id="app-title" placeholder="Name der Kegel-Anwendung">
            </div>
            <div class="form-group">
                <label for="app-url">Internetadresse (URL)</label>
                <input type="url" id="app-url" placeholder="https://...">
            </div>
            <div class="form-group">
                <label for="app-desc">Kurzbeschreibung / Regeln</label>
                <textarea id="app-desc" rows="2" placeholder="Kurzer Infotext oder Regelhinweis..."></textarea>
            </div>
            
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button id="cancel-edit-btn" style="display:none;" onclick="cancelEdit()">Abbrechen</button>
                <button class="btn-accent" onclick="saveAppForm()">💾 App-Link speichern</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 KegelClub Master Pro &bull; Das ultimative Cockpit für deine Kegel-Apps</p>
    </footer>

    <script>
        // Standard-Links für den Einsteiger
        const defaultApps = [
            { icon: "🎳", title: "Kegeln App 1", url: "https://juppijo.github.io/Kegeln/Kegeln-1/", desc: "Die Haupt-Kegel-App für die digitale Tafel." },
            { icon: "🔢", title: "Kegeln App 2", url: "https://juppijo.github.io/Kegeln/Kegeln-2/", desc: "Erweiterte Punktezählung und Spielvarianten." },
            { icon: "🎳", title: "kegel Hub 2", url: "https://juppijo.github.io/Kegeln/kegel_hub_index.html", desc: "Das ultimative Cockpit für deine Kegel-Apps Vers. 2" },
            { icon: "📖", title: "Gebrauchsanweisung", url: "https://juppijo.github.io/Kegeln/Kegeln-2/gebrauchsanweisung.html", desc: "Anleitung, Spielregeln und Tipps für die Bedienung." },
            { icon: "🏠", title: "Hausnummer-Rechner", url: "#", desc: "Direkter Einstieg für das Auswürfeln hoher Hausnummern." },
            { icon: "🃏", title: "17 und 4 Karte", url: "#", desc: "Das klassische Kartenspiel auf die Kegelbahn übersetzt." },
            { icon: "🏎️", title: "6-Tage-Rennen", url: "#", desc: "Ausdauerspiel mit ansteigender Multiplikator-Wertung." },
            { icon: "🤪", title: "Idiotenkegeln", url: "#", desc: "Spaßturnier mit Würfen rückwärts durch die Beine oder links." },
            { icon: "🦊", title: "Fuchsjagd", url: "#", desc: "Ein Spieler flieht, alle anderen jagen mit Holz-Treffern hinterher." },
            { icon: "🎄", title: "Tannenbaum", url: "#", desc: "Teambasiertes Abwerfen der exakten Pyramidenstruktur." },
            { icon: "📊", title: "Club-Kasse & Abrechnung", url: "#", desc: "Die integrierte Gesamtliste für Strafgelder, Pudel und Stinas." }
        ];

        let appsList = [];
        let currentThemeIndex = 0;
        const themes = ["theme-turquoise", "theme-light", "theme-classic"];

        // Initialisierung beim Laden
        document.addEventListener("DOMContentLoaded", () => {
            loadAppsFromStorage();
            loadThemeFromStorage();
        });

        // Apps rendern
        function renderApps() {
            const container = document.getElementById("links-container");
            container.innerHTML = "";

            appsList.forEach((app, index) => {
                const card = document.createElement("div");
                card.className = "link-card";
                card.innerHTML = `
                    <div class="link-info" onclick="openApp('${app.url}')">
                        <div class="link-title">${app.icon} ${app.title}</div>
                        <div class="link-desc">${app.desc || "Keine Beschreibung hinterlegt."}</div>
                    </div>
                    <div class="card-actions">
                        <button class="btn-sm" onclick="editApp(${index})">✏️ Ändern</button>
                        <button class="btn-sm btn-danger" onclick="deleteApp(${index})">❌ Löschen</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openApp(url) {
            if (url && url !== "#") {
                window.open(url, "_blank");
            } else {
                alert("Dies ist ein Platzhalter-Link. Bearbeite ihn über den 'Ändern'-Button, um deine eigene Unterseite zu hinterlegen!");
            }
        }

        // Formular-Aktion: Hinzufügen oder Editieren speichern
        function saveAppForm() {
            const icon = document.getElementById("app-icon").value.trim() || "🎳";
            const title = document.getElementById("app-title").value.trim();
            const url = document.getElementById("app-url").value.trim() || "#";
            const desc = document.getElementById("app-desc").value.trim();
            const editIndexStr = document.getElementById("edit-index").value;

            if (!title) {
                alert("Bitte gib mindestens einen Titel für die App ein!");
                return;
            }

            const appData = { icon, title, url, desc };

            if (editIndexStr !== "") {
                // Bearbeiten
                const index = parseInt(editIndexStr, 10);
                appsList[index] = appData;
            } else {
                // Neu hinzufügen
                appsList.push(appData);
            }

            saveAppsToStorage();
            renderApps();
            cancelEdit();
        }

        // Editier-Modus aktivieren
        function editApp(index) {
            const app = appsList[index];
            document.getElementById("app-icon").value = app.icon;
            document.getElementById("app-title").value = app.title;
            document.getElementById("app-url").value = app.url;
            document.getElementById("app-desc").value = app.desc;
            document.getElementById("edit-index").value = index;

            document.getElementById("editor-title").innerText = `✏️ App '${app.title}' bearbeiten`;
            document.getElementById("cancel-edit-btn").style.display = "inline-flex";
            document.getElementById("app-title").focus();
        }

        // Bearbeitung abbrechen
        function cancelEdit() {
            document.getElementById("app-icon").value = "";
            document.getElementById("app-title").value = "";
            document.getElementById("app-url").value = "";
            document.getElementById("app-desc").value = "";
            document.getElementById("edit-index").value = "";

            document.getElementById("editor-title").innerText = "➕ Neuen Link / App hinzufügen";
            document.getElementById("cancel-edit-btn").style.display = "none";
        }

        // App löschen
        function deleteApp(index) {
            if (confirm(`Möchtest du die App "${appsList[index].title}" wirklich aus der Übersicht entfernen?`)) {
                appsList.splice(index, 1);
                saveAppsToStorage();
                renderApps();
                cancelEdit();
            }
        }

        // LocalStorage Anbindung
        function saveAppsToStorage() {
            localStorage.setItem("kegelhub_apps", JSON.stringify(appsList));
        }

        function loadAppsFromStorage() {
            const stored = localStorage.getItem("kegelhub_apps");
            if (stored) {
                try {
                    appsList = JSON.parse(stored);
                } catch (e) {
                    appsList = [...defaultApps];
                }
            } else {
                appsList = [...defaultApps];
            }
            renderApps();
        }

        // --- STYLE / DESIGN MODUS STEUERUNG ---
        function toggleStyleMode() {
            document.body.classList.remove(themes[currentThemeIndex]);
            currentThemeIndex = (currentThemeIndex + 1) % themes.length;
            document.body.className = themes[currentThemeIndex];
            localStorage.setItem("kegelhub_theme_index", currentThemeIndex);
        }

        function loadThemeFromStorage() {
            const storedThemeIndex = localStorage.getItem("kegelhub_theme_index");
            if (storedThemeIndex !== null) {
                currentThemeIndex = parseInt(storedThemeIndex, 10);
            } else {
                currentThemeIndex = 0;
            }
            document.body.className = themes[currentThemeIndex];
        }

        // --- VOLLBILDMODUS STEUERUNG ---
        function toggleFullscreen() {
            const btn = document.getElementById("fullscreen-btn");
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen()
                    .then(() => {
                        btn.innerText = "📺 Vollbild beenden";
                    })
                    .catch(err => alert(`Fehler: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById("fullscreen-btn");
            if (!document.fullscreenElement) {
                btn.innerText = "📺 Vollbildmodus";
            }
        });

        // --- JSON IMPORT / EXPORT ---
        function exportLinksJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appsList, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `Kegelhub_Links_Sicherung.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importLinksJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        appsList = importedData;
                        saveAppsToStorage();
                        renderApps();
                        alert("🎉 Deine Links wurden erfolgreich importiert und geladen!");
                    } else {
                        alert("Ungültiges Dateiformat. Es muss eine JSON-Liste sein.");
                    }
                } catch (err) { 
                    alert("Fehler beim Einlesen der JSON: " + err.message); 
                }
            };
            reader.readAsText(file);
            event.target.value = ""; 
        }
    </script>
</body>
</html>
